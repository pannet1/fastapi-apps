[project]
name = "fastapi-marketplace"
version = "0.1.0"
description = "A dynamic, modular FastAPI App Marketplace allowing seamless integration and lifecycle management of any existing FastAPI application."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
marketplace = "cli.cli:main"

[tool.setuptools.packages.find]
include = ["marketplace*", "cli*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
