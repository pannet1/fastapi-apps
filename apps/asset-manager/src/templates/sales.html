{% extends "base.html" %}

{% block title %}Sales & Transactions • Asset Manager{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <!-- Header -->
    <div class="mb-8">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold mb-3">
            <i class="fa-solid fa-cart-shopping text-xs"></i> Point of Sale
        </div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Record New Sale</h1>
        <p class="text-xs text-slate-400 mt-1">Generate sales invoice, assign customer, and collect cash or credit balance.</p>
    </div>

    <!-- Sale Form -->
    <div class="glass-card rounded-2xl p-6 sm:p-8 border border-slate-800 shadow-xl mb-8">
        <form action="/process-sale" method="post" class="space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                <div class="relative">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                        Customer Name <span class="text-[10px] font-normal text-emerald-400">(Synced with Contacts)</span>
                    </label>
                    <input type="text"
                           id="customer_name"
                           name="customer_name"
                           autocomplete="off"
                           placeholder="Type customer or contact name..."
                           required
                           class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                    <input type="hidden" id="customer_vcard" name="customer_vcard" value="">
                    <div id="contact-dropdown" class="absolute z-50 left-0 right-0 mt-1 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl overflow-hidden hidden"></div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Phone / WhatsApp</label>
                    <input type="text"
                           id="customer_phone"
                           name="customer_phone"
                           placeholder="+91..."
                           class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white font-mono focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Amount Paid Today (₹)</label>
                    <input type="number"
                           step="0.01"
                           name="paid"
                           placeholder="0.00"
                           required
                           class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white font-mono focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Payment Mode / Reference Note</label>
                <input type="text"
                       name="payment_note"
                       placeholder="e.g. Cash, UPI/GPay, Bank Transfer, or Cheque"
                       value="Cash"
                       class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Select Inventory Item</label>
                <select name="inventory_id" required
                        class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                    <option value="" disabled selected>-- Choose an in-stock unit --</option>
                    {% for item in available_items %}
                    <option value="{{ item.inventory_id }}">
                        #{{ item.inventory_id }} - {{ item.brand }} {{ item.model }} (SN: {{ item.serial }}) - ₹{{ item.selling_price }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit"
                    class="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white font-bold rounded-xl text-sm transition shadow-lg shadow-emerald-500/20">
                Finalize Sale & Record Transaction
            </button>
        </form>
    </div>
</div>

<script>
(() => {
    const input = document.getElementById('customer_name');
    const phoneInput = document.getElementById('customer_phone');
    const vcardInput = document.getElementById('customer_vcard');
    const dropdown = document.getElementById('contact-dropdown');
    let debounceTimer;

    input.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        vcardInput.value = ''; // Reset custom vcard if user edits name manually
        const query = input.value.trim();
        if (query.length < 2) {
            dropdown.innerHTML = '';
            dropdown.classList.add('hidden');
            return;
        }

        debounceTimer = setTimeout(async () => {
            try {
                const res = await fetch(`/api/contacts/search?q=${encodeURIComponent(query)}`);
                if (!res.ok) return;
                const data = await res.json();
                const contacts = data.results || [];

                if (contacts.length === 0) {
                    dropdown.classList.add('hidden');
                    return;
                }

                dropdown.innerHTML = contacts.map((c, idx) => `
                    <div class="contact-item px-4 py-2.5 hover:bg-slate-800 cursor-pointer border-b border-slate-800/60 last:border-0 flex items-center justify-between"
                         data-idx="${idx}">
                        <span class="text-white text-xs font-semibold">${c.name}</span>
                        ${c.phone ? `<span class="text-[11px] font-mono text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">${c.phone}</span>` : ''}
                    </div>
                `).join('');

                dropdown.querySelectorAll('.contact-item').forEach(el => {
                    el.addEventListener('click', () => {
                        const idx = parseInt(el.dataset.idx, 10);
                        const sel = contacts[idx];
                        if (sel) {
                            input.value = sel.name;
                            phoneInput.value = sel.phone || '';
                            vcardInput.value = sel.vcard || '';
                        }
                        dropdown.classList.add('hidden');
                    });
                });

                dropdown.classList.remove('hidden');
            } catch (err) {
                console.error('Contact search error:', err);
            }
        }, 180);
    });

    document.addEventListener('click', (e) => {
        if (!input.contains(e.target) && !dropdown.contains(e.target)) {
            dropdown.classList.add('hidden');
        }
    });
})();
</script>
{% endblock %}
